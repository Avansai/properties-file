name: Performance

on:
  pull_request:
    branches: ['main']

# Cancel superseded runs: with rapid pushes, an older run finishing last would otherwise post a
# fresh-looking comment describing a stale commit.
concurrency:
  group: performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This workflow only measures. Posting the report to the PR happens in performance-comment.yml,
# triggered by `workflow_run`: `pull_request` runs from forks get a read-only token no matter what
# permissions are declared here, so a comment step in this workflow fails on every external PR.
# Keeping the write-capable step in a separate workflow also means untrusted PR code never runs
# with a write token (which `pull_request_target` would grant).
jobs:
  benchmark:
    name: Performance comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build-artifacts

      - name: Run benchmark comparison
        run: npx tsx performance/benchmarks/compare.ts

      - name: Run size comparison
        run: npx tsx performance/size/compare.ts

      - name: Combine reports
        run: >-
          mkdir -p performance/.report &&
          cat performance/benchmarks/.results/comparison.md > performance/.report/report.md &&
          printf '\n\n---\n\n' >> performance/.report/report.md &&
          cat performance/size/.results/comparison.md >> performance/.report/report.md

      # The job summary keeps the numbers visible on the run itself, independently of the comment.
      - name: Publish job summary
        run: cat performance/.report/report.md >> "$GITHUB_STEP_SUMMARY"

      # The comment workflow resolves the PR from this run's head SHA, so the artifact carries the
      # report body only.
      - name: Upload report for the comment workflow
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: performance/.report/report.md
          retention-days: 7
